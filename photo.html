<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>もんだいをおくる</title>
<style>
  :root { --paper: #f7fbff; --ink: #23324a; --soft: #52627a; --accent: #2f6fdb; --on: #fff; --panel: #fff; --line: #d5e2f1; --ok: #1a7f4b; --error: #b42318; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #142034; --ink: #eaf1fb; --soft: #a9b8cf; --accent: #6ea2ff; --on: #0d1a30; --panel: #1a2840; --line: #2a3c5c; --ok: #6fd9a0; --error: #ff8a80; }
  }
  * { box-sizing: border-box; }
  html { color-scheme: light dark; }
  body { margin: 0; min-height: 100dvh; background: var(--paper); color: var(--ink);
         font-family: "Hiragino Maru Gothic ProN", "Zen Maru Gothic", sans-serif; font-weight: 500; }
  main { max-width: 480px; margin: 0 auto; padding: 28px 16px; display: grid; gap: 18px; justify-items: center; text-align: center; }
  h1 { margin: 0; font-size: 24px; font-weight: 900; }
  p { margin: 0; line-height: 1.8; color: var(--soft); }
  .btn { font: inherit; font-size: 20px; font-weight: 900; background: var(--accent); color: var(--on); border: 0; border-radius: 999px;
         padding: 18px 32px; cursor: pointer; }
  .btn.sub { background: var(--panel); color: var(--ink); border: 2px solid var(--line); font-size: 17px; padding: 14px 24px; }
  .btn:disabled { opacity: .5; }
  input[type=file] { display: none; }
  .previews { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .previews img { max-width: 30%; max-height: 22dvh; border-radius: 12px; border: 2px solid var(--line); }
  #msg { font-size: 18px; font-weight: 700; min-height: 1.8em; color: var(--ink); }
  #msg.ok { color: var(--ok); } #msg.error { color: var(--error); }
  #text { background: var(--panel); border: 2px solid var(--line); border-radius: 16px; padding: 12px 14px; color: var(--ink);
          text-align: left; white-space: pre-wrap; width: 100%; line-height: 1.7; }
</style>
</head>
<body>
<main>
  <h1>もんだいをおくる</h1>
  <p>わからない もんだいを しゃしんに とってね。<br>おしえてくれるのは パソコンの 画面だよ。</p>
  <label class="btn" id="pick-label"><input type="file" id="file" accept="image/*" multiple>しゃしんを えらぶ(なんまいでも)</label>
  <div id="previews" class="previews"></div>
  <p id="msg" aria-live="polite"></p>
  <button class="btn sub" id="again" hidden>もう1まい おくる</button>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  // 大きい写真はそのまま送ると遅いので、縮めてから送る
  async function shrink(file) {
    const bmp = await createImageBitmap(file);
    const scale = Math.min(1, 1280 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas");
    c.width = Math.round(bmp.width * scale);
    c.height = Math.round(bmp.height * scale);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", .85);
  }
  function say(text, cls = "") { $("msg").textContent = text; $("msg").className = cls; }
  $("file").onchange = async () => {
    const files = [...$("file").files].slice(0, 6);
    if (!files.length) return;
    $("pick-label").hidden = true;
    say(`${files.length}まい おくっているよ…`);
    try {
      const urls = await Promise.all(files.map(shrink));
      $("previews").replaceChildren(...urls.map((u) => Object.assign(document.createElement("img"), { src: u, alt: "" })));
      const res = await fetch("/photo", { method: "POST", headers: { "Content-Type": "application/json" },
                                          body: JSON.stringify({ images: urls.map((u) => u.split(",")[1]) }) });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || `サーバーのエラー (${res.status})`);
      say(`${data.ids.length}まい おくったよ! パソコンの 画面で えらんでね`, "ok");
    } catch (e) {
      say(`おくれなかったよ: ${e.message}`, "error");
    }
    $("again").hidden = false;
  };
  $("again").onclick = () => {
    $("file").value = "";
    $("previews").replaceChildren();
    $("again").hidden = true;
    $("pick-label").hidden = false;
    say("");
  };
</script>
</body>
</html>
